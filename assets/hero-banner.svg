<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1325"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="18" fill="none" stroke="#24324b" stroke-width="2"/>
  <rect x="0" y="374" width="1200" height="6" rx="3" fill="url(#accentLine)"/>

  <!-- Decorative Glows -->
  <circle cx="950" cy="190" r="210" fill="#2563eb" opacity="0.10"/>
  <circle cx="1020" cy="140" r="130" fill="#10b981" opacity="0.08"/>

  <!-- Left Content: Brand & Title -->
  <g transform="translate(60, 56)">
    <!-- Logo Icon -->
    <rect x="0" y="0" width="68" height="68" rx="16" fill="url(#logoGrad)"/>
    <rect x="14" y="15" width="40" height="13" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <rect x="14" y="35" width="40" height="13" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="22" cy="21.5" r="2.2" fill="#ffffff"/>
    <circle cx="22" cy="41.5" r="2.2" fill="#ffffff"/>
    <path d="M30 21.5h18M30 41.5h18M34 48v8M24 56h20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Title -->
    <text x="86" y="38" font-family="Segoe UI, Inter, Roboto, sans-serif" font-size="38" font-weight="800" fill="#f8fafc">NetPulse</text>
    <rect x="258" y="12" width="76" height="30" rx="15" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="296" y="32" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#60a5fa" letter-spacing="1.5">IPAM</text>

    <text x="86" y="64" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Scanner Réseau Local IPv4 • Résolution DNS • Table ARP &amp; OUI • Export CSV &amp; PDF
    </text>

    <!-- Description -->
    <text x="0" y="116" font-family="Segoe UI, Inter, sans-serif" font-size="15.5" fill="#cbd5e1">
      Application web tout-en-un de gestion de plan d'adressage IP (IPAM) et de découverte réseau.
    </text>
    <text x="0" y="140" font-family="Segoe UI, Inter, sans-serif" font-size="15.5" fill="#cbd5e1">
      Sélectionnez manuellement vos réseaux et masques (/16 à /32), visualisez l'occupation en temps réel,
    </text>
    <text x="0" y="164" font-family="Segoe UI, Inter, sans-serif" font-size="15.5" fill="#cbd5e1">
      archivez vos scans, ré-importez vos plans CSV et générez des rapports PDF professionnels.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 196)">
      <rect x="0" y="0" width="142" height="32" rx="16" fill="#111827" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="4.5" fill="#10b981"/>
      <text x="30" y="21" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#ecfdf5">Scan IPv4 Rapide</text>

      <rect x="154" y="0" width="148" height="32" rx="16" fill="#111827" stroke="#06b6d4" stroke-width="1.2"/>
      <circle cx="172" cy="16" r="4.5" fill="#06b6d4"/>
      <text x="184" y="21" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#cffafe">DNS PTR &amp; NetBIOS</text>

      <rect x="314" y="0" width="150" height="32" rx="16" fill="#111827" stroke="#8b5cf6" stroke-width="1.2"/>
      <circle cx="332" cy="16" r="4.5" fill="#a78bfa"/>
      <text x="344" y="21" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#f3e8ff">MAC &amp; Vendor OUI</text>

      <rect x="476" y="0" width="148" height="32" rx="16" fill="#111827" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="494" cy="16" r="4.5" fill="#f59e0b"/>
      <text x="506" y="21" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#fef3c7">Historique &amp; CSV</text>

      <rect x="0" y="42" width="165" height="32" rx="16" fill="#111827" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="18" cy="58" r="4.5" fill="#ef4444"/>
      <text x="30" y="63" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#fee2e2">Rapport PDF Intégré</text>

      <rect x="177" y="42" width="185" height="32" rx="16" fill="#111827" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="195" cy="58" r="4.5" fill="#3b82f6"/>
      <text x="207" y="63" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#dbeafe">Prêt pour Docker / Portainer</text>
    </g>
  </g>

  <!-- Right Graphic: Mini IPAM Matrix Card -->
  <g transform="translate(760, 44)">
    <rect x="0" y="0" width="385" height="290" rx="14" fill="#111827" stroke="#24324b" stroke-width="1.5"/>
    <rect x="0" y="0" width="385" height="44" rx="14" fill="#182235"/>
    <circle cx="20" cy="22" r="5" fill="#ef4444"/>
    <circle cx="36" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="22" r="5" fill="#10b981"/>
    <text x="74" y="27" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#93c5fd">192.168.1.0/24 — 255.255.255.0</text>

    <!-- Mini KPI row -->
    <rect x="16" y="58" width="110" height="52" rx="8" fill="#0d1424" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="75" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">ACTIVES</text>
    <text x="26" y="98" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#34d399">42 IPs</text>

    <rect x="137" y="58" width="110" height="52" rx="8" fill="#0d1424" stroke="#06b6d4" stroke-width="1"/>
    <text x="147" y="75" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">NOMS DNS</text>
    <text x="147" y="98" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#38bdf8">38 PTR</text>

    <rect x="258" y="58" width="110" height="52" rx="8" fill="#0d1424" stroke="#8b5cf6" stroke-width="1"/>
    <text x="268" y="75" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">OCCUPATION</text>
    <text x="268" y="98" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#c4b5fd">18.5%</text>

    <!-- Visual IP Grid Preview -->
    <g transform="translate(16, 124)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="40" height="32" rx="5" fill="#0a0f18" stroke="#334155" stroke-dasharray="3,2"/>
      <text x="20" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#475569">.0</text>

      <rect x="45" y="0" width="40" height="32" rx="5" fill="#2e1065" stroke="#a78bfa"/>
      <circle cx="79" cy="6" r="3" fill="#38bdf8"/>
      <text x="65" y="16" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#f5f3ff">.1</text>
      <text x="65" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#c4b5fd">gw-lan</text>

      <rect x="90" y="0" width="40" height="32" rx="5" fill="#064e3b" stroke="#10b981"/>
      <circle cx="124" cy="6" r="3" fill="#38bdf8"/>
      <text x="110" y="16" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#ecfdf5">.2</text>
      <text x="110" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#6ee7b7">srv-ad</text>

      <rect x="135" y="0" width="40" height="32" rx="5" fill="#064e3b" stroke="#10b981"/>
      <circle cx="169" cy="6" r="3" fill="#38bdf8"/>
      <text x="155" y="16" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#ecfdf5">.3</text>
      <text x="155" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#6ee7b7">nas-01</text>

      <rect x="180" y="0" width="40" height="32" rx="5" fill="#141d2e" stroke="#233047"/>
      <text x="200" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#64748b">.4</text>

      <rect x="225" y="0" width="40" height="32" rx="5" fill="#451a03" stroke="#f59e0b"/>
      <text x="245" y="16" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#fef3c7">.5</text>
      <text x="245" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#fcd34d">vip-db</text>

      <rect x="270" y="0" width="40" height="32" rx="5" fill="#064e3b" stroke="#10b981"/>
      <circle cx="304" cy="6" r="3" fill="#38bdf8"/>
      <text x="290" y="16" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#ecfdf5">.6</text>
      <text x="290" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#6ee7b7">pve-01</text>

      <rect x="315" y="0" width="38" height="32" rx="5" fill="#141d2e" stroke="#233047"/>
      <text x="334" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#64748b">.7</text>

      <!-- Mini Table Rows Preview -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="353" height="30" rx="5" fill="#0d1424" stroke="#1e293b"/>
        <text x="10" y="19" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#60a5fa">192.168.1.1</text>
        <text x="98" y="19" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">gw-firewall.lan</text>
        <text x="218" y="19" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Fortinet</text>
        <text x="295" y="19" font-family="Consolas, monospace" font-size="10" fill="#34d399">0.8 ms</text>

        <rect x="0" y="35" width="353" height="30" rx="5" fill="#0d1424" stroke="#1e293b"/>
        <text x="10" y="54" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#60a5fa">192.168.1.2</text>
        <text x="98" y="54" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">srv-ad01.lan</text>
        <text x="218" y="54" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">VMware</text>
        <text x="295" y="54" font-family="Consolas, monospace" font-size="10" fill="#34d399">1.2 ms</text>

        <rect x="0" y="70" width="353" height="30" rx="5" fill="#0d1424" stroke="#1e293b"/>
        <text x="10" y="89" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#60a5fa">192.168.1.3</text>
        <text x="98" y="89" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">nas-synology.lan</text>
        <text x="218" y="89" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Synology</text>
        <text x="295" y="89" font-family="Consolas, monospace" font-size="10" fill="#34d399">0.9 ms</text>
      </g>
    </g>
  </g>
</svg>
