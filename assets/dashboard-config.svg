<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="btnRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="1200" height="540" rx="14" fill="#0b0f19" stroke="#24324b" stroke-width="2"/>

  <!-- Topbar -->
  <rect x="2" y="2" width="1196" height="68" rx="12" fill="#111827"/>
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#24324b" stroke-width="1"/>

  <rect x="24" y="15" width="40" height="40" rx="10" fill="url(#btnBlue)"/>
  <text x="44" y="41" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#fff">NP</text>
  <text x="76" y="34" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#f1f5f9">NetPulse</text>
  <rect x="162" y="18" width="48" height="20" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="186" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#60a5fa">IPAM</text>
  <text x="76" y="52" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#94a3b8">Scanner Réseau Local IPv4, Résolution DNS, Sauvegardes, Import/Export CSV &amp; Rapport PDF</text>

  <!-- Topbar Action Buttons -->
  <rect x="520" y="19" width="172" height="32" rx="6" fill="url(#btnRed)"/>
  <text x="606" y="39" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#fff">📄 Générer PDF (IPs Utilisées)</text>

  <rect x="702" y="19" width="160" height="32" rx="6" fill="#182235" stroke="#24324b"/>
  <text x="782" y="39" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9">⬆️ Ré-importer un Plan (CSV)</text>

  <rect x="872" y="19" width="132" height="32" rx="6" fill="#182235" stroke="#24324b"/>
  <text x="938" y="39" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9">🕒 Anciens Scans (4)</text>

  <rect x="1014" y="19" width="162" height="32" rx="6" fill="none" stroke="#24324b"/>
  <text x="1095" y="39" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">Exporter Plan Complet (CSV)</text>

  <!-- Section 1 Card: Network & Subnet Mask Configuration -->
  <g transform="translate(24, 90)">
    <rect x="0" y="0" width="1152" height="295" rx="14" fill="#111827" stroke="#24324b" stroke-width="1.5"/>

    <text x="24" y="32" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">1. Configuration du Réseau &amp; Masque de Sous-Réseau</text>
    <text x="24" y="50" font-family="Segoe UI, sans-serif" font-size="12" fill="#94a3b8">Saisissez manuellement le réseau/sous-réseau et choisissez le masque, ou cliquez sur une interface locale détectée.</text>

    <!-- Detected Interface Pills -->
    <text x="640" y="35" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">INTERFACES DU SERVEUR :</text>
    <rect x="795" y="18" width="175" height="26" rx="13" fill="#182235" stroke="#3b82f6"/>
    <circle cx="809" cy="31" r="3.5" fill="#10b981"/>
    <text x="820" y="35" font-family="Consolas, monospace" font-size="11" fill="#f1f5f9">eth0 192.168.1.0/24</text>

    <rect x="978" y="18" width="150" height="26" rx="13" fill="#182235" stroke="#24324b"/>
    <circle cx="992" cy="31" r="3.5" fill="#10b981"/>
    <text x="1003" y="35" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">zt0 10.147.20.0/24</text>

    <!-- Form Inputs Row -->
    <g transform="translate(24, 72)">
      <!-- Input 1 -->
      <text x="0" y="14" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Adresse Réseau / Sous-réseau IPv4</text>
      <rect x="0" y="22" width="265" height="38" rx="6" fill="#0d1424" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="14" y="46" font-family="Consolas, monospace" font-size="14" fill="#f1f5f9">192.168.1.0</text>
      <text x="0" y="75" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">Saisissez l'IP du réseau ou d'un hôte</text>

      <!-- Input 2 -->
      <text x="285" y="14" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Choix du Masque de Sous-Réseau (CIDR)</text>
      <rect x="285" y="22" width="285" height="38" rx="6" fill="#0d1424" stroke="#24324b"/>
      <text x="299" y="46" font-family="Segoe UI, sans-serif" font-size="13" fill="#f1f5f9">/24 — 255.255.255.0 (254 hôtes)   ▾</text>
      <text x="285" y="75" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">Sélection rapide de /16 à /32</text>

      <!-- Input 3 -->
      <text x="590" y="14" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Masque de Sous-Réseau (Manuel / Décimal)</text>
      <rect x="590" y="22" width="235" height="38" rx="6" fill="#0d1424" stroke="#24324b"/>
      <text x="604" y="46" font-family="Consolas, monospace" font-size="14" fill="#f1f5f9">255.255.255.0</text>
      <text x="590" y="75" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">Modifiable (ex: 255.255.255.128 ou /25)</text>

      <!-- Input 4 -->
      <text x="845" y="14" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Options d'analyse</text>
      <rect x="845" y="22" width="259" height="58" rx="6" fill="#0d1424" stroke="#24324b"/>
      <text x="859" y="41" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#f1f5f9">☑️ Noms DNS (PTR / Hostname)</text>
      <text x="859" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#f1f5f9">☑️ Ports TCP &amp; Latence (450 ms)</text>
    </g>

    <!-- Live Subnet Calculator Banner -->
    <g transform="translate(24, 165)">
      <rect x="0" y="0" width="1104" height="54" rx="8" fill="#162033" stroke="#24324b"/>
      <rect x="0" y="0" width="5" height="54" rx="2" fill="#3b82f6"/>

      <text x="20" y="20" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">SOUS-RÉSEAU CIDR</text>
      <text x="20" y="39" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#f1f5f9">192.168.1.0/24</text>

      <text x="195" y="20" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">ADRESSE RÉSEAU</text>
      <text x="195" y="39" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#f1f5f9">192.168.1.0</text>

      <text x="365" y="20" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">MASQUE DÉCIMAL</text>
      <text x="365" y="39" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#f1f5f9">255.255.255.0 (/24)</text>

      <text x="565" y="20" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">PLAGE D'HÔTES UTILISABLES</text>
      <text x="565" y="39" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#f1f5f9">192.168.1.1 → 192.168.1.254</text>

      <text x="805" y="20" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">BROADCAST</text>
      <text x="805" y="39" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#f1f5f9">192.168.1.255</text>

      <text x="955" y="20" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">CAPACITÉ HÔTES</text>
      <text x="955" y="39" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#38bdf8">254 hôtes</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(24, 234)">
      <rect x="0" y="0" width="280" height="40" rx="7" fill="url(#btnBlue)"/>
      <text x="140" y="25" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#fff">📡 Scanner ce Sous-Réseau Maintenant</text>

      <rect x="294" y="0" width="235" height="40" rx="7" fill="none" stroke="#24324b"/>
      <text x="411" y="25" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">Afficher le Plan IPAM sans scanner</text>

      <rect x="543" y="0" width="215" height="40" rx="7" fill="#182235" stroke="#24324b"/>
      <text x="650" y="25" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#f1f5f9">💾 Sauvegarder l'état actuel</text>
    </g>
  </g>

  <!-- Section 2: 4 KPI Cards -->
  <g transform="translate(24, 402)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="276" height="114" rx="12" fill="#111827" stroke="#24324b" stroke-width="1.5"/>
    <text x="20" y="28" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">ADRESSES IPv4 UTILISÉES (EN LIGNE)</text>
    <circle cx="254" cy="24" r="5" fill="#10b981"/>
    <text x="20" y="68" font-family="Segoe UI, sans-serif" font-size="32" font-weight="800" fill="#f1f5f9">42</text>
    <rect x="155" y="48" width="102" height="22" rx="11" fill="#064e3b"/>
    <text x="206" y="63" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#34d399">18.5% occupé</text>
    <rect x="20" y="88" width="236" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="20" y="88" width="65" height="7" rx="3.5" fill="url(#progGrad)"/>

    <!-- KPI 2 -->
    <rect x="292" y="0" width="276" height="114" rx="12" fill="#111827" stroke="#24324b" stroke-width="1.5"/>
    <text x="312" y="28" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">HÔTES AVEC NOM DNS RÉSOLU</text>
    <circle cx="546" cy="24" r="5" fill="#06b6d4"/>
    <text x="312" y="68" font-family="Segoe UI, sans-serif" font-size="32" font-weight="800" fill="#f1f5f9">38</text>
    <text x="375" y="64" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">90% des IPs actives</text>
    <text x="312" y="96" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Résolution PTR / Hostname / NetBIOS</text>

    <!-- KPI 3 -->
    <rect x="584" y="0" width="276" height="114" rx="12" fill="#111827" stroke="#24324b" stroke-width="1.5"/>
    <text x="604" y="28" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">RÉSERVÉES / HORS-LIGNE CONNUES</text>
    <circle cx="838" cy="24" r="5" fill="#f59e0b"/>
    <text x="604" y="68" font-family="Segoe UI, sans-serif" font-size="32" font-weight="800" fill="#f1f5f9">5</text>
    <text x="650" y="64" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Historique &amp; Statiques</text>
    <text x="604" y="96" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Équipements éteints ou IPs réservées</text>

    <!-- KPI 4 -->
    <rect x="876" y="0" width="276" height="114" rx="12" fill="#111827" stroke="#24324b" stroke-width="1.5"/>
    <text x="896" y="28" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">ADRESSES IPv4 LIBRES</text>
    <circle cx="1130" cy="24" r="5" fill="#64748b"/>
    <text x="896" y="68" font-family="Segoe UI, sans-serif" font-size="32" font-weight="800" fill="#f1f5f9">207</text>
    <text x="975" y="64" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">sur 254 hôtes</text>
    <text x="896" y="96" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Dernier scan : 2026-10-22 14:45:10 (2.8s)</text>
  </g>
</svg>
