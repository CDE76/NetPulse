version: "3.8"

services:
  netpulse-ipam:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    command:
      - python3
      - -c
      - |
        import urllib.request, tarfile, shutil, subprocess, sys
        urllib.request.urlretrieve('https://github.com/CDE76/NetPulse/archive/refs/heads/main.tar.gz', '/tmp/app.tar.gz')
        tarfile.open('/tmp/app.tar.gz').extractall('/tmp', filter='data')
        shutil.copytree('/tmp/NetPulse-main', '/app', dirs_exist_ok=True)
        sys.exit(subprocess.call(['python3', '/app/app.py']))
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${PORT:-8095}
      - IPAM_DATA_DIR=/data
      - IPAM_ADMIN_USER=${IPAM_ADMIN_USER:-admin}
      - IPAM_ADMIN_PASSWORD=${IPAM_ADMIN_PASSWORD:-admin123}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ipam_data:/data
    networks:
      - hostnet

networks:
  hostnet:
    external: true
    name: host

volumes:
  ipam_data:
    driver: local
