version: "3.8"

services:
  netpulse-ipam:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    command:
      - sh
      - -c
      - |
        export DEBIAN_FRONTEND=noninteractive
        if ! command -v ping >/dev/null 2>&1; then
          apt-get update -qq &&
          apt-get install -y -qq --no-install-recommends iputils-ping iproute2 net-tools dnsutils ca-certificates
        fi
        python3 -c "import urllib.request, tarfile, shutil; urllib.request.urlretrieve('https://github.com/CDE76/NetPulse/archive/refs/heads/main.tar.gz', '/tmp/app.tar.gz'); tarfile.open('/tmp/app.tar.gz').extractall('/tmp', filter='data'); shutil.copytree('/tmp/NetPulse-main', '/app', dirs_exist_ok=True)" &&
        python3 /app/app.py
    environment:
      - PYTHONUNBUFFERED=1
      - DEBIAN_FRONTEND=noninteractive
      - PORT=${PORT:-8095}
      - IPAM_DATA_DIR=/data
      - IPAM_ADMIN_USER=${IPAM_ADMIN_USER:-admin}
      - IPAM_ADMIN_PASSWORD=${IPAM_ADMIN_PASSWORD:-admin123}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ipam_data:/data
    networks:
      - hostnet

networks:
  hostnet:
    external: true
    name: host

volumes:
  ipam_data:
    driver: local
